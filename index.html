<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Business Finder</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo finder.png">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
    
    <!-- Custom Notification/Alert Box -->
    <div id="notificationArea" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full transition-all duration-300"></div>

    <div class="max-w-5xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-500 text-white shadow-lg shadow-brand-500/30 mb-4">
                <i class="fa-solid fa-map-location-dot text-3xl"></i>
            </div>
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Business Finder</h1>
            <p class="mt-2 text-slate-500 max-w-2xl mx-auto">Discover and export local businesses powered by Google Places API.</p>
        </div>

        <!-- Main Form Card -->
        <div class="glass-panel shadow-xl shadow-slate-200/50 rounded-2xl border border-white/50 overflow-hidden mb-8">
            <div class="p-6 sm:p-8">
                
                <!-- API Setup Section -->
                <div class="bg-slate-50 rounded-xl p-5 mb-8 border border-slate-200">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex-1 w-full">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Google Places API Key</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-key text-slate-400"></i>
                                </div>
                                <input type="password" id="apiKeyInput" placeholder="Enter your API key here..."
                                    class="w-full pl-10 pr-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-sm transition-all shadow-sm">
                            </div>
                        </div>
                        <button id="testApiBtn" class="w-full sm:w-auto mt-6 sm:mt-0 inline-flex items-center justify-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-medium py-2.5 px-5 rounded-lg text-sm transition-all shadow-sm hover:shadow">
                            <i class="fa-solid fa-flask"></i>
                            Test API
                        </button>
                    </div>
                    <div id="apiTestResult" class="hidden mt-3 p-3 rounded-lg text-sm font-medium transition-all"></div>
                </div>

                <form id="searchForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Location Input -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Location Coordinates</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-location-crosshairs text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                                </div>
                                <input type="text" id="locationInput" value="-26.2041,28.0473" required placeholder="lat,lng"
                                    class="w-full pl-10 pr-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-sm transition-all shadow-sm">
                                <span class="absolute right-3 top-2.5 text-xs text-slate-400">Lat, Lng</span>
                            </div>
                        </div>
                        
                        <!-- Radius Input -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Search Radius (meters)</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-circle-notch text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                                </div>
                                <input type="number" id="radiusInput" value="50000" min="1" max="50000" required
                                    class="w-full pl-10 pr-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-sm transition-all shadow-sm">
                                <span class="absolute right-3 top-2.5 text-xs text-slate-400">Max: 50k</span>
                            </div>
                        </div>

                        <!-- Query Input -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Search Query</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-magnifying-glass text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                                </div>
                                <input type="text" id="queryInput" value="software company" required placeholder="e.g. coffee shop, web agency"
                                    class="w-full pl-10 pr-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-sm transition-all shadow-sm">
                            </div>
                        </div>

                        <!-- Max Results Input -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Maximum Results</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-list-ol text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                                </div>
                                <input type="number" id="maxResults" value="30" min="1" max="60" required
                                    class="w-full pl-10 pr-3 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-sm transition-all shadow-sm">
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100">
                        <button type="submit" id="searchBtn"
                            class="w-full flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3.5 px-6 rounded-xl transition-all duration-200 transform hover:-translate-y-0.5 shadow-lg shadow-brand-500/30 text-sm">
                            <i class="fa-solid fa-radar"></i>
                            Scan for Businesses
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-16 bg-white/50 rounded-2xl border border-white backdrop-blur-sm shadow-sm mb-8">
            <div class="relative">
                <div class="w-12 h-12 rounded-full border-4 border-slate-200"></div>
                <div class="w-12 h-12 rounded-full border-4 border-brand-500 border-t-transparent animate-spin absolute top-0 left-0"></div>
            </div>
            <p class="text-sm font-medium text-slate-600 mt-4 animate-pulse">Contacting Google Places API...</p>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="hidden transform transition-all duration-500 opacity-0 translate-y-4">
            <div class="glass-panel rounded-2xl shadow-xl shadow-slate-200/50 border border-white/50 overflow-hidden">
                
                <div class="p-6 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-50/50">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-brand-500"></i> Search Results
                        </h2>
                        <p class="text-sm text-slate-500 mt-1" id="resultsSummary">Found 0 businesses</p>
                    </div>
                    <button id="downloadCsvBtn" class="hidden inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition-all shadow-md hover:shadow-lg shadow-emerald-500/20 transform hover:-translate-y-0.5">
                        <i class="fa-solid fa-file-csv"></i>
                        Export CSV
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200 text-sm">
                        <thead class="bg-slate-50">
                            <tr>
                                <th scope="col" class="px-6 py-4 text-left font-semibold text-slate-600 uppercase tracking-wider text-xs">
                                    Business Name
                                </th>
                                <th scope="col" class="px-6 py-4 text-left font-semibold text-slate-600 uppercase tracking-wider text-xs">
                                    Address
                                </th>
                                <th scope="col" class="px-6 py-4 text-left font-semibold text-slate-600 uppercase tracking-wider text-xs">
                                    Website
                                </th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody" class="bg-white divide-y divide-slate-100">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="px-6 py-4 border-t border-slate-200 bg-slate-50/50">
                    <div id="paginationControls" class="flex justify-between items-center hidden">
                        <button id="prevPageBtn" class="inline-flex items-center gap-2 bg-white hover:bg-slate-100 text-slate-700 font-medium py-2 px-4 border border-slate-300 rounded-lg text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fa-solid fa-chevron-left text-xs"></i> Previous
                        </button>
                        <span id="pageIndicator" class="text-sm font-medium text-slate-600 bg-white px-4 py-1 rounded-full border border-slate-200 shadow-sm">
                            Page 1 of 1
                        </span>
                        <button id="nextPageBtn" class="inline-flex items-center gap-2 bg-white hover:bg-slate-100 text-slate-700 font-medium py-2 px-4 border border-slate-300 rounded-lg text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            Next <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State variables
        let allResults = [];
        let currentPage = 1;
        const rowsPerPage = 6;

        // Utility: Show Notification (replaces alert)
        function showNotification(message, type = 'error') {
            const container = document.getElementById('notificationArea');
            const notif = document.createElement('div');
            
            const colors = type === 'error' 
                ? 'bg-red-50 text-red-800 border-red-200' 
                : 'bg-emerald-50 text-emerald-800 border-emerald-200';
            
            const icon = type === 'error' 
                ? '<i class="fa-solid fa-circle-exclamation text-red-500 mt-0.5"></i>' 
                : '<i class="fa-solid fa-circle-check text-emerald-500 mt-0.5"></i>';

            notif.className = `flex items-start gap-3 p-4 rounded-xl border shadow-lg transform transition-all duration-300 translate-x-full opacity-0 ${colors}`;
            notif.innerHTML = `
                ${icon}
                <div class="flex-1">
                    <p class="text-sm font-medium">${message}</p>
                </div>
                <button class="text-current opacity-50 hover:opacity-100" onclick="this.parentElement.remove()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;
            
            container.appendChild(notif);
            
            // Animate in
            requestAnimationFrame(() => {
                notif.classList.remove('translate-x-full', 'opacity-0');
            });

            // Auto remove after 5 seconds
            setTimeout(() => {
                notif.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => notif.remove(), 300);
            }, 5000);
        }

        // Get API Key helper
        function getApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                showNotification("Please enter your Google Places API Key.", "error");
                document.getElementById('apiKeyInput').focus();
                return null;
            }
            return key;
        }

        
        // Test API Connection
        document.getElementById('testApiBtn').addEventListener('click', async () => {
            const apiKey = getApiKey();
            if (!apiKey) return;

            const testResultDiv = document.getElementById('apiTestResult');
            testResultDiv.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
            
            testResultDiv.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Testing API connection...';
            testResultDiv.className = 'mt-3 p-3 rounded-lg text-sm font-medium bg-blue-50 text-blue-700 border border-blue-200 flex items-center block';

            try {
                const response = await fetch('https://places.googleapis.com/v1/places:searchText', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Goog-Api-Key': apiKey,
                        'X-Goog-FieldMask': 'places.displayName'
                    },
                    body: JSON.stringify({ textQuery: "pizza" })
                });

                const data = await response.json();
                if (response.ok) {
                    testResultDiv.className = 'mt-3 p-3 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center block';
                    testResultDiv.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i>API Test Successful! Connection established.';
                } else {
                    throw new Error(data.error?.message || 'Request denied or invalid key');
                }
            } catch (error) {
                testResultDiv.className = 'mt-3 p-3 rounded-lg text-sm font-medium bg-red-50 text-red-700 border border-red-200 flex items-center block';
                testResultDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i>API Test Failed: ${error.message}`;
            }
        });

        // Search Businesses Submission
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const apiKey = getApiKey();
            if (!apiKey) return;

            const locationStr = document.getElementById('locationInput').value.trim();
            const radius = parseFloat(document.getElementById('radiusInput').value);
            const query = document.getElementById('queryInput').value.trim();
            const maxResults = parseInt(document.getElementById('maxResults').value) || 30;

            const [lat, lng] = locationStr.split(',').map(Number);
            
            if (isNaN(lat) || isNaN(lng)) {
                showNotification("Invalid location format. Please use 'lat,lng' format.", "error");
                return;
            }

            // UI Adjustments for Loading state
            const loadingEl = document.getElementById('loading');
            const resultsSection = document.getElementById('resultsSection');
            const downloadCsvBtn = document.getElementById('downloadCsvBtn');
            const searchBtn = document.getElementById('searchBtn');

            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Scanning...';
            searchBtn.classList.add('opacity-75', 'cursor-not-allowed');

            resultsSection.classList.remove('opacity-100', 'translate-y-0');
            resultsSection.classList.add('opacity-0', 'translate-y-4');
            
            setTimeout(() => {
                resultsSection.classList.add('hidden');
                loadingEl.classList.remove('hidden');
                downloadCsvBtn.classList.add('hidden');
            }, 300);

            allResults = [];
            currentPage = 1;

            try {
                let pageToken = null;

                do {
                    const requestBody = {
                        textQuery: query,
                        locationBias: {
                            circle: {
                                center: { latitude: lat, longitude: lng },
                                radius: radius
                            }
                        },
                        // Cap max fetch limit per request based on remaining items needed
                        pageSize: Math.min(maxResults - allResults.length, 20)
                    };

                    if (pageToken) {
                        requestBody.pageToken = pageToken;
                    }

                    const response = await fetch('https://places.googleapis.com/v1/places:searchText', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Goog-Api-Key': apiKey,
                            'X-Goog-FieldMask': 'places.id,places.displayName,places.formattedAddress,places.websiteUri,nextPageToken'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error?.message || 'Failed to fetch places');
                    }

                    if (data.places) {
                        for (const place of data.places) {
                            const name = place.displayName?.text || '';
                            const address = place.formattedAddress || '';
                            const website = place.websiteUri || '';
                            
                            // Prevent duplicates
                            if (!allResults.some(r => r.name === name && r.address === address)) {
                                allResults.push({ name, address, website });
                            }
                        }
                    }

                    pageToken = data.nextPageToken;

                } while (pageToken && allResults.length < maxResults);

                // Trim to exact max results if over-fetched
                allResults = allResults.slice(0, maxResults);

                renderTable();
                
                // Show results UI
                loadingEl.classList.add('hidden');
                resultsSection.classList.remove('hidden');
                
                // Trigger reflow for animation
                void resultsSection.offsetWidth;
                
                resultsSection.classList.add('opacity-100', 'translate-y-0');
                resultsSection.classList.remove('opacity-0', 'translate-y-4');
                
                if (allResults.length > 0) {
                    downloadCsvBtn.classList.remove('hidden');
                    document.getElementById('downloadCsvBtn').style.display = 'inline-flex';
                    showNotification(`Successfully loaded ${allResults.length} businesses.`, "success");
                } else {
                    showNotification("No businesses found for this query and location.", "error");
                }

            } catch (error) {
                loadingEl.classList.add('hidden');
                showNotification(error.message, "error");
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fa-solid fa-radar"></i> Scan for Businesses';
                searchBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        function renderTable() {
            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = '';

            const paginationControls = document.getElementById('paginationControls');
            const totalPages = Math.ceil(allResults.length / rowsPerPage) || 1;
            
            document.getElementById('resultsSummary').textContent = `Found ${allResults.length} business${allResults.length !== 1 ? 'es' : ''}`;

            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageItems = allResults.slice(start, end);

            if (pageItems.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="px-6 py-12 text-center text-slate-500 bg-slate-50/50">
                            <div class="flex flex-col items-center justify-center">
                                <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
                                <p class="text-sm font-medium">No results found.</p>
                                <p class="text-xs mt-1">Try adjusting your search criteria or radius.</p>
                            </div>
                        </td>
                    </tr>`;
                paginationControls.classList.add('hidden');
                return;
            }

            pageItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors group";
                
                // Get initials for a cute avatar
                const initials = (item.name || '?').substring(0, 2).toUpperCase();

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 h-10 w-10 bg-brand-100 text-brand-700 rounded-lg flex items-center justify-center font-bold text-sm shadow-sm group-hover:bg-brand-500 group-hover:text-white transition-colors">
                                ${escapeHtml(initials)}
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-semibold text-slate-900">${escapeHtml(item.name)}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-sm text-slate-600 flex items-start max-w-xs truncate" title="${escapeHtml(item.address)}">
                            <i class="fa-solid fa-location-dot mt-1 mr-2 text-slate-400 shrink-0"></i>
                            <span class="truncate">${escapeHtml(item.address) || '<span class="text-slate-400 italic">No address provided</span>'}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        ${item.website 
                            ? `<a href="${escapeHtml(item.website)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-brand-600 hover:text-brand-800 font-medium text-sm hover:underline transition-colors"><i class="fa-solid fa-link text-xs"></i> Visit Site</a>` 
                            : '<span class="text-slate-400 text-sm italic">No website</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (allResults.length > rowsPerPage) {
                paginationControls.classList.remove('hidden');
                document.getElementById('pageIndicator').textContent = `Page ${currentPage} of ${totalPages}`;
                document.getElementById('prevPageBtn').disabled = currentPage === 1;
                document.getElementById('nextPageBtn').disabled = currentPage === totalPages;
            } else {
                paginationControls.classList.add('hidden');
            }
        }

        // Pagination Events
        document.getElementById('prevPageBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });

        document.getElementById('nextPageBtn').addEventListener('click', () => {
            const totalPages = Math.ceil(allResults.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });

        // CSV Export 
        document.getElementById('downloadCsvBtn').addEventListener('click', () => {
            if(allResults.length === 0) return;
            
            let csvContent = "Name,Address,Website\r\n";
            allResults.forEach(item => {
                const row = [
                    `"${(item.name || '').replace(/"/g, '""')}"`,
                    `"${(item.address || '').replace(/"/g, '""')}"`,
                    `"${(item.website || '').replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\r\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.setAttribute('download', `business-export-${new Date().getTime()}.csv`);
            a.style.display = 'none';
            document.body.appendChild(a);
            
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showNotification("CSV export downloaded successfully.", "success");
        });

        // Security Helper
        function escapeHtml(str) {
            return (str || '').replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
